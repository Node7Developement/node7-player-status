<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>NODE7 Player Status</title>
</head>
<body>
    <main id="hud" aria-hidden="true">
        <section id="left-status" class="left-status" aria-label="Player status">
            <div class="status-row" data-row="job">
                <svg class="status-icon status-icon--job" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6.25 3.5h11.5v17H6.25z"></path>
                    <path d="M9 3.5v2h6v-2M9 9h6M9 12.5h6M9 16h4"></path>
                </svg>
                <span id="job-value">UNEMPLOYED_0</span>
            </div>

            <div class="status-row" data-row="duty">
                <svg class="status-icon status-icon--duty" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 8.25h10l1.4 2.4-.8 7.85H6.4l-.8-7.85z"></path>
                    <path d="M9.25 8.25V6.4h5.5v1.85M8 13.35h8"></path>
                    <path class="slash" d="M3.5 4l17 16"></path>
                </svg>
                <span id="duty-value">OFF DUTY</span>
            </div>

            <div class="status-row" data-row="time">
                <svg class="status-icon status-icon--time" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="8.5"></circle>
                    <path d="M12 7.25v5l3.4 2.05"></path>
                </svg>
                <span id="time-value">12:00 AM</span>
            </div>

            <div class="status-row" data-row="radio">
                <svg class="status-icon status-icon--radio" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7.2 7.25h9.6a1.8 1.8 0 0 1 1.8 1.8v9.25H5.4V9.05a1.8 1.8 0 0 1 1.8-1.8z"></path>
                    <path d="M8.5 4.1l7.35 3.15M8.3 10.25h7.4M8.3 13h4.65"></path>
                    <circle cx="15.5" cy="15.25" r="1.45"></circle>
                    <path class="slash radio-slash" d="M3.5 4l17 16"></path>
                </svg>
                <span id="radio-value">OFF</span>
            </div>

            <div class="status-row" data-row="online">
                <svg class="status-icon status-icon--online" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6.1 10.75h11.8M7.5 10.75l1.25-4.2h6.5l1.25 4.2"></path>
                    <path d="M5.25 14.1c1.85-1.35 4.1-2.05 6.75-2.05s4.9.7 6.75 2.05"></path>
                    <path d="M7.3 14.25l1.2 4.05h7l1.2-4.05"></path>
                </svg>
                <span id="online-value">0</span>
            </div>
        </section>

        <section id="economy" class="economy" aria-label="Economy status">
            <div class="economy-entry bank-entry" data-economy="bank" title="Bank">
                <svg class="economy-icon economy-icon--bank" viewBox="0 0 32 32" aria-hidden="true">
                    <path class="icon-fill" d="M16 3.25 29 10.1v2.35H3V10.1L16 3.25Z"></path>
                    <path d="M5 26.75h22M7 24.25h18M8.5 13v10.8M13.5 13v10.8M18.5 13v10.8M23.5 13v10.8"></path>
                </svg>
                <span class="money-value"><span id="bank-main">0</span><span class="money-decimal" id="bank-decimal">00</span></span>
            </div>

            <div class="economy-entry gold-entry" data-economy="gold" title="Gold">
                <svg class="economy-icon economy-icon--gold" viewBox="0 0 34 30" aria-hidden="true">
                    <path class="gold-bar" d="M5.1 18.1h11.8l2.15 7.15H2.95L5.1 18.1Z"></path>
                    <path class="gold-bar" d="M17.1 18.1h11.8l2.15 7.15H14.95l2.15-7.15Z"></path>
                    <path class="gold-bar gold-bar--top" d="M11.1 8.3h11.8l2.15 7.15H8.95L11.1 8.3Z"></path>
                    <path class="gold-detail" d="M8.1 20.2h5.8M20.1 20.2h5.8M14.1 10.4h5.8"></path>
                </svg>
                <span class="money-value"><span id="gold-main">0</span><span class="money-decimal" id="gold-decimal">00</span></span>
            </div>

            <div class="economy-entry cash-entry" data-economy="cash" title="Cash">
                <span class="cash-symbol" aria-hidden="true">$</span>
                <span class="money-value"><span id="cash-main">0</span><span class="money-decimal" id="cash-decimal">00</span></span>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
